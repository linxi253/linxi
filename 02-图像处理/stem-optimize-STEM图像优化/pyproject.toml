# 项目元数据与兼容版本范围声明；精确锁定用于构建的版本见
# requirements.txt / requirements-win-py310.lock。本项目以源码/打包
# 方式运行，不作为 pip 包分发。
[project]
name = "stem-enhancer"
version = "2.1.0"
description = "HRTEM/STEM TIFF 图像增强工具（自适应频域降噪）"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "opencv-python-headless>=4.12,<5",
    "tifffile>=2025.5.10",
    "defusedxml>=0.7.1",
    "imagecodecs>=2024.12.30",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  "legacy",
  "build",
  "dist",
  ".venv",
  "OPtimize.exe_extracted",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
