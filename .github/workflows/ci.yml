name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：跑在 Linux 上，无需任何项目依赖，几秒完成
  # ---------------------------------------------------------------------------
  lint:
    name: lint & compile
    runs-on: ubuntu-latest
    steps:
      # 审计条目 95：第三方 action 一律按 commit SHA 固定（配 Dependabot 更新），
      # 上游移动标签不再能改写 CI 行为。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ruff
        # 审计条目 98：ruff 按精确版本固定（0.16.10，2026-10-02 PyPI/清华镜像
        # 实测最新），避免上游发版悄然改变 lint 结果；pip 本身保持升级。
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.10

      - name: Ruff lint
        # 只挑「真错误」：E9 语法/运行时；F63 值比较/断言类错误（F631 对非空
        # 元组断言、F632 与 str/bytes/int 字面量做 is 比较、F633 Py2 风格
        # `print >>` 语句——审计工单 132 更正：与 __all__ 无关，__all__ 相关
        # 的未定义名属 F822）；F7 类型注释语法；F82 未定义名。
        # 不跑 ruff 默认全量规则集：19 条矩阵腿中仅 5 个的 pyproject.toml 带
        # [tool.ruff] 配置（drift-correction-v7、hrtem-HRTEM滤波工具、stem-optimize、
        # EELS边缘价态分析、全整合），其余 14 个没有——全量规则下这些项目会按 ruff
        # 默认值累计数千条既有风格告警（UP006/I001/BLE001…），不适合在引入 CI 的
        # 第一步就全部卡红。
        #
        # 注意：ruff 会把 `x=1;match=y` 误判为 E999（把 match 当软关键字语句），这是 ruff
        # 解析器缺陷，CPython 的 ast.parse/tokenize 判定其合法——因此不以 ruff 的
        # E999 为准。它并不会「兜底」ruff 的结果（审计工单 98 更正：compileall 是
        # 与本步骤互不读取输出的独立后续步骤），但真正的语法错误仍会在那条独立
        # 步骤里被 CPython 解析器捕获，不会漏过 CI。
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Compile all sources
        # 审计条目 97：排除集与根 .gitignore 的目录类规则对齐（venv 系/build 系/
        # dist 系/release/wheelhouse/legacy/运行期输出目录/*egg-info/__pycache__），
        # 并用 [/\\] 同时兼容 CI 的 POSIX 分隔符与本地 Windows 手跑时的反斜杠
        # （旧模式写死 `/`，在 Windows 上排除完全失效）。
        run: >-
          python -m compileall -q -x
          '(^|[/\\])(\.venv[^/\\]*|venv|env|build(-[^/\\]*)?|dist(-[^/\\]*)?|release|wheelhouse|legacy|outputs?|results|runs|[^/\\]*\.egg-info|__pycache__)([/\\]|$)'
          .

      # 审计工单 127：CI 矩阵与 .tools 脚本的项目清单收敛为单一来源——纯文本
      # 比对 ci.yml 的 test 矩阵与 .tools/verify-envs.py 的 JOBS（要求集合相等）
      # 及 .tools/provision-envs.py 的 JOBS（要求矩阵为其子集）。不做任何
      # venv/子进程操作，秒级完成；任一侧清单漂移时此处变红。
      - name: Guard ci.yml matrix <-> .tools project lists
        run: python .tools/verify-envs.py --check-matrix .github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # 逐子项目测试。跑在 Windows 上：这些工具是 Windows 桌面 GUI 程序，测试套件
  # 本身就按 Windows 语义编写（大小写不敏感路径、win-py310 锁文件、Tk 原生可用），
  # 放到 Linux 会产生与代码无关的假失败。
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 审计条目 46：该项目 requires-python = ">=3.11,<3.14"，其 .venv/锁在
          # Python 3.12.14 上验证（见 环境隔离说明.md 第 3 节），故显式 py: '3.12'；
          # 其余项目的锁文件头部均标注按 Python 3.10（多数为 3.10.9）生成，走下方默认 '3.10'。
          - { name: '01 视频切片工具',      dir: '01-视频与数据提取/视频切片工具',  ffmpeg: true, py: '3.12' }
          - { name: '02 TIFF 漂移矫正 v7', dir: '02-图像处理/drift-correction-v7' }
          - { name: '02 HRTEM/STEM 滤波',  dir: '02-图像处理/hrtem-HRTEM滤波工具' }
          # 该项目的锁文件是 Windows + CPython 3.10 + --require-hashes，必须用 3.10
          - { name: '02 STEM 图像优化',    dir: '02-图像处理/stem-optimize-STEM图像优化', py: '3.10' }
          - { name: '02 图像加滤镜工具',    dir: '02-图像处理/图像加滤镜工具' }
          - { name: '02 离域效应去除',      dir: '02-图像处理/离域效应去除工具' }
          - { name: '03 Strain++ GPA',    dir: '03-应变分析/strainpp-GPA应变分析' }
          # 测试导入 yaml——requirements.txt / pyproject / lock 均已声明 pyyaml
          # （审计工单 41），无需再用 deps 补装。
          - { name: '03 PPA 原子级应力',   dir: '03-应变分析/原子级应力分析-PPA' }
          - { name: '03 原子识别纯算法',    dir: '03-应变分析/原子识别纯算法' }
          # 审计条目 13：仓库里唯一配了完整 pytest 工程却被矩阵遗漏的子项目。
          # pyproject 锁 requires-python >=3.10,<3.11 → 必须用 3.10；src/ 布局
          # 且无 conftest.py，测试前须 editable 安装才能 import atom_center；
          # 无根级 requirements*.txt，依赖随 editable 安装带入；tests 大多不需
          # torch（backends.py 延迟导入，test_onnx_parity 用 importorskip 降级）。
          # deps 补 opencv（tests 实测需要但 core dependencies 未声明，见 Known gaps）。
          # packaged_smoke 一例已改为按字体资产存在性条件跳过，不再需要 deselect。
          - { name: '03 原子中心识别模型开发', dir: '03-应变分析/原子中心识别模型开发', py: '3.10', editable: true,
              deps: 'opencv-python==4.11.0.86' }
          - { name: '04 原子衬度统计',      dir: '04-统计分析/原子衬度统计' }
          - { name: '04 特征区域演化分析',   dir: '04-统计分析/特征区域演化分析' }
          - { name: '04 统计面积',         dir: '04-统计分析/统计面积' }
          - { name: '04 晶体/非晶区域统计', dir: '04-统计分析/非晶面积统计' }
          - { name: '05 4D-STEM Processor', dir: '05-4D-STEM分析/4D-STEM-Processor' }
          - { name: '05 EELS 边缘价态分析', dir: '05-EELS分析/EELS边缘价态分析工具' }
          - { name: '09 HRTEM 模拟',      dir: '09-HRTEM模拟' }
          # tests/ 下是脚本式自检（README 记录 `python tests/verify_physics.py`），
          # 函数靠返回值串联，pytest 无法收集（会报 fixture 'pl' not found）
          - { name: '010 STEM 模拟',      dir: '010-STEM模拟', test: 'python tests/verify_physics.py' }
          - { name: '全整合 TEM Suite',    dir: '全整合', test: 'python tests/smoke_test.py' }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (审计 95)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 审计条目 46：默认统一到 3.10。矩阵内除「视频切片工具」（requires-python
          # >=3.11，上方显式 py: '3.12'）外，其余锁文件头部均标注按 Python 3.10
          # 生成（多数为 3.10.9；stem-optimize 与原子中心另显式 py: '3.10'）；
          # 3.12 下这些钉死版本的轮子可用性未经锁层面保证。
          python-version: ${{ matrix.py || '3.10' }}
          cache: pip

      - name: Provide FFmpeg 8.x (required by 视频切片工具, >= 8.0.3)
        if: matrix.ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 审计条目 63：CI 不得静默使用与 tools/ffmpeg/PROVENANCE.md 不一致的构建。
          # 旧钉住的发布标签 autobuild-2026-08-21-13-40 已被上游删除（2026-10-02 实测
          # 下载链接与 GitHub API 均返回 404），2026-10-02 已重钉到当时 latest 的构建
          # n8.1.3-14-g330caae0c1-20261001，并同步 PROVENANCE.md 与本地 tools/ffmpeg。
          # latest 别名未来仍会漂移：本步骤对归档做 SHA-256 强校验，上游一发布新构建
          # 本步骤就会显式失败，提示复核新构建并重钉 PROVENANCE.md（连同本地二进制
          # 与 build.ps1 的逐文件哈希），杜绝「用漂移来的二进制跑测试却报绿」的供应链缺口。
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip'
          # tools/ffmpeg/PROVENANCE.md 钉住的归档 SHA-256（与分发侧 build.ps1 同源）
          $expected = 'a8fbc540821511f2720763bb59aad8738cd2fc8b0e4677ea1795d4b6b6cc9b77'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) {
            throw ("下载的 FFmpeg 归档 SHA-256 为 $hash，与 tools/ffmpeg/PROVENANCE.md 钉住的构建" +
                   "（$expected，n8.1.3-14-g330caae0c1-20261001）不一致——上游 latest 已漂移，" +
                   "拒绝使用未校验的二进制。请复核新构建并同步更新 PROVENANCE.md（与本地 tools/ffmpeg、" +
                   "build.ps1 的逐文件哈希一起），让 CI 与分发重新对齐后重跑。")
          }
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          $dest = Join-Path '${{ matrix.dir }}' 'tools/ffmpeg'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item (Join-Path $inner.FullName 'bin/ffmpeg.exe') $dest -Force
          Copy-Item (Join-Path $inner.FullName 'bin/ffprobe.exe') $dest -Force
          Copy-Item (Join-Path $inner.FullName 'bin/*.dll') $dest -Force
          & (Join-Path $dest 'ffmpeg.exe') -version | Select-Object -First 1

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # 各工具的锁定文件名不统一，按优先级自动探测。
          # requirements-win-py310.lock 是 Windows 原生锁（含哈希），优先使用。
          $lock = @(
            'requirements-win-py310.lock', 'requirements.lock.txt', 'requirements.lock',
            'requirements-lock.txt', 'requirements.txt'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "using requirements: $lock"
          if ($lock) { python -m pip install -r $lock }
          # 工单38：原先的裸 `pip install pytest` 会把锁文件钉住的 pytest
          # 无条件覆盖成最新版（05 4D-STEM 曾锁 pytest==9.1.1，CI 实际又装上
          # 更新的 9.x，与 requirements.txt 的声明区间脱节）。改为仅当按锁
          # 安装后 pytest 仍缺席时才安装；matrix.deps 仍照常补装。
          $PSNativeCommandUseErrorActionPreference = $false
          $deps = '${{ matrix.deps }}'.Trim()
          python -c "import pytest" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "pytest already provided by $lock; skip bare install"
            if ($deps) { python -m pip install $deps }
          } else {
            if ($deps) { python -m pip install pytest $deps }
            else { python -m pip install pytest }
          }

      # src/ 布局的项目（原子中心识别模型开发）无 conftest.py 兜底 import，
      # pytest 收集前必须先可编辑安装出 atom_center 包（审计条目 13）
      - name: Install project (editable)
        if: matrix.editable
        working-directory: ${{ matrix.dir }}
        run: python -m pip install -e .

      # 工单38守门（修法第 3 步）：实际安装的 pytest 必须落在该子项目
      # requirements.txt 声明的版本区间内，防止锁与声明再次漂移
      # （05 4D-STEM 曾声明 pytest<9，锁却装 9.1.1，又被裸装覆盖）。
      # 未声明 pytest 或 pytest 未安装的子项目自动跳过；遇到本断言
      # 不支持的版本运算符立即报错，不做静默放行。
      - name: Assert pytest matches declared range
        working-directory: ${{ matrix.dir }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 原生命令 stderr 重写为错误记录的行为仅存在于 Windows PowerShell 5.1，
          # pwsh 7 默认关闭；此处显式关闭以兼容任何宿主配置。
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path requirements.txt)) { Write-Host '无 requirements.txt，跳过断言'; exit 0 }
          $req = Select-String -Path requirements.txt -Pattern '^\s*pytest\s*([=<>!~].*?)\s*$' | Select-Object -First 1
          if (-not $req) { Write-Host 'requirements.txt 未声明 pytest，跳过断言'; exit 0 }
          $spec = (($req.Matches[0].Groups[1].Value) -split ';')[0].Trim()
          $probe = python -m pytest --version 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $probe) { Write-Host 'pytest 未安装，跳过断言'; exit 0 }
          $ver = (($probe | Select-Object -First 1) -replace '^pytest\s+', '').Trim()
          foreach ($c in ($spec -split ',')) {
            if (-not $c.Trim()) { continue }
            if ($c -notmatch '^\s*(>=|<=|==|!=|>|<)\s*([0-9.]+)\s*$') {
              throw "requirements.txt 的 pytest 约束 '$($c.Trim())' 含本断言不支持的运算符，请人工核对"
            }
            $op = $Matches[1]
            # [version] 至少要求 major.minor 两段，单段上界（如 <10）须补 .0
            $boundText = $Matches[2]
            if ($boundText -notmatch '\.') { $boundText = "$boundText.0" }
            $bound = [version]$boundText
            $cur = [version]$ver
            $ok = switch ($op) {
              '>=' { $cur -ge $bound }
              '>'  { $cur -gt $bound }
              '<=' { $cur -le $bound }
              '<'  { $cur -lt $bound }
              '==' { $cur -eq $bound }
              '!=' { $cur -ne $bound }
            }
            if (-not $ok) { throw "pytest $ver 不满足 requirements.txt 声明的区间 $spec" }
          }
          Write-Host "pytest $ver 满足 requirements.txt 声明的区间 $spec"

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        env:
          # GitHub Windows runner 的 TEMP 默认是 8.3 短名（C:\Users\RUNNER~1\AppData\Local\Temp），
          # 会让「保存的路径 vs 真实路径」这类比较出现长短名不一致而假失败。
          # runner.temp 是 D:\a\_temp，各段都短于 8 字符，不会产生短名别名。
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        # -rs 让 skip 原因出现在 CI 输出里（工单 94：GUI 测试按环境条件跳过时
        # 必须能看出跳过了什么，而不是只看到计数）
        run: ${{ matrix.test || 'python -m pytest -q -rs' }}

  # ---------------------------------------------------------------------------
  # 引擎同步守门（审计条目 15 轻量路线）：09-HRTEM模拟/tem_sim 与
  # 010-STEM模拟/stem_sim 是同一套模拟引擎的两份拷贝，已因单侧打补丁分叉过
  # （相位标度 /pixel_area 曾修在 010、漏在 09）。对两侧公共模块做 AST 级
  # 函数体比对、对 data/ 数据表做 sha256 比对，未在 .tools/check_engine_sync.py
  # 豁免表中声明理由的不一致即失败。跑在 Linux 上，纯标准库，无需项目依赖。
  # ---------------------------------------------------------------------------
  engine-sync:
    name: engine sync (tem_sim vs stem_sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (审计 95)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check 09 tem_sim <-> 010 stem_sim
        run: python .tools/check_engine_sync.py

# Known gaps found by this workflow (not fixed here — see repository issues):
#   1. 【已解决 2026-10-02】03-应变分析/原子级应力分析-PPA 的 yaml 依赖已在
#      requirements.txt / pyproject.toml / lock 中声明（审计工单 41），
#      矩阵行不再用 deps 补装。
#   2. 010-STEM模拟/tests/test_e2e_au.py 用 test_* 命名但不具 pytest 结构（函数间靠返回值串联），
#      故 CI 改跑 README 记录的 tests/verify_physics.py。
#   3. 03-应变分析/原子中心识别模型开发：多个测试经 preprocessing 懒加载 import cv2，
#      但 pyproject core dependencies 未声明 opencv（只在 [infer]/[train] extras 里），
#      CI 用 deps=opencv-python==4.11.0.86 补齐（与其 extras 的 pin 一致）。
#   4. 03-应变分析/原子中心识别模型开发 tests/test_annotations.py::
#      test_packaged_smoke_path_exercises_gui_and_export 曾断言捆绑字体
#      (assets/NotoSansCJKsc-AtomAnnotator.otf) 注册成功，而仓库为控制体积未收录
#      该 .otf（仅存 FONT_SOURCE.txt 与 OFL.txt，见其下载指引）。现测试已改为按
#      资产存在性条件跳过：资产在场才断言注册成功，否则 pytest.skip——CI 不再
#      deselect 该用例（字体回补后断言自动恢复生效）。
