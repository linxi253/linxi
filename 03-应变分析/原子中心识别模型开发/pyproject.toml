[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atom-center"
version = "0.3.0"
description = "Shared development foundation for HAADF-STEM and HRTEM atom-center models"
readme = "README.md"
# 隔离边界声明（审计 42）：本子项目有意钉在 CPython 3.10 + numpy 1.26.4 /
# opencv 4.11 的训练与推理栈上；仓库内其余工具使用 numpy 2.2.6。两组精确
# 钉死的版本不能并入同一份统一依赖，跨项目调用必有版本落差；若要统一，
# 必须先解除 <3.11 约束，再重新验证训练、ONNX 导出与纯 CPU 推理三条链路。
# 本文件与 requirements/ 三份锁文件（inference-win-py310 / training-win-py310 /
# lock-win-cu128）中的 numpy==1.26.4 保持一致，改动时须同步。
requires-python = ">=3.10,<3.11"
dependencies = [
  "matplotlib==3.10.9",
  # 隔离边界（审计 42）：其余工具为 numpy 2.2.6；统一的先决条件是解除 <3.11。
  "numpy==1.26.4",
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
  "scipy==1.15.3",
  "tifffile==2025.5.10",
]

[project.scripts]
atom-annotate = "atom_center.annotator_gui:main"
atom-center = "atom_center.cli:main"

[project.optional-dependencies]
infer = [
  "onnxruntime==1.20.1",
  "opencv-python==4.11.0.86",
]
train = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "onnx==1.19.1",
  "onnxruntime==1.20.1",
  "opencv-python==4.11.0.86",
  "ultralytics==8.4.135",
]
ml = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "onnx==1.19.1",
  "onnxruntime==1.20.1",
  "opencv-python==4.11.0.86",
  "ultralytics==8.4.135",
]
dev = [
  "pyinstaller==6.22.2",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atom_center = ["assets/*"]

[tool.pytest.ini_options]
# Windows 上实测：pytest 默认的 fd 捕获与 Tk/Tcl 初始化相互干扰，
# 受控 A/B 中 stdlib Tk 参数化用例在 fd 捕获下 6/600 失败、sys 捕获下 0/600 失败
# （可复现，但 C 层机制未证实）。--capture=sys 不改动 OS 文件描述符，
# 仍保留 Python 层 stdout/stderr 捕获，断言与用例数量均不变。
# 这只是一项针对已观测干扰的缓解，不代表历史 Tk 问题已全部解决。
addopts = "-ra --strict-markers --capture=sys"
testpaths = ["tests"]
markers = [
  "ml: tests requiring the PyTorch/ONNX runtime",
]

[tool.coverage.run]
branch = true
source = ["atom_center"]

[tool.coverage.report]
show_missing = true
skip_covered = true
