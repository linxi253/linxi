[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-strain-analysis"
version = "3.4.0"
description = "Atomic displacement and strain analysis with local peak-pair and legacy CST modes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
  "tifffile>=2023.0",
  "pillow>=9",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = []

[tool.setuptools]
packages = ["ppa_core"]
