[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strainpp-gpa"
dynamic = ["version"]
description = "Geometric phase analysis and strain mapping for HRTEM images"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Strain++ GPA contributors"},
]
keywords = ["HRTEM", "GPA", "strain", "electron-microscopy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
  "tifffile>=2023.9.26",
  "ttkbootstrap>=1.10,<3",
  "ncempy>=1.16,<2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]
test = ["build>=1.2", "twine>=5"]

[project.scripts]
strainpp-gpa = "strainpp_gpa.cli:main"
strainpp-gpa-gui = "strainpp_gpa.gui:main"
strainpp-gpa-batch = "strainpp_gpa.batch_cli:main"

[project.urls]
Upstream = "https://github.com/JJPPeters/Strainpp"

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[tool.setuptools]
py-modules = [
  "_version",
]

[tool.setuptools.packages.find]
include = ["strainpp_gpa*"]
