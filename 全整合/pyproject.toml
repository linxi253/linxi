[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temsuite"
version = "1.1.0"
description = "TEM Suite —— 电镜数据分析工具集成软件"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "matplotlib>=3.10,<4",
    "pandas>=2.3,<3",
    "tifffile>=2025.5",
    "Pillow>=12",
    "scikit-image>=0.25",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "imagecodecs>=2025.3",
    "defusedxml>=0.7",
    "ttkbootstrap>=1.10",
    "ncempy>=1.16",
    "tkinterdnd2>=0.4",
    "opencv-python>=4.10",
]

[project.scripts]
temsuite = "temsuite.app:main"

[tool.setuptools]
packages = ["temsuite"]

[tool.pytest.ini_options]
# Windows 上实测：pytest 默认的 fd 捕获与 Tk/Tcl 初始化相互干扰，
# 受控 A/B 中 stdlib Tk 参数化用例在 fd 捕获下 6/600 失败、sys 捕获下 0/600 失败
# （可复现，但 C 层机制未证实）。--capture=sys 不改动 OS 文件描述符，
# 仍保留 Python 层 stdout/stderr 捕获，断言与用例数量均不变。
# 这只是一项针对已观测干扰的缓解，不代表历史 Tk 问题已全部解决。
addopts = "--capture=sys"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",   # 行宽由 formatter 控制
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
